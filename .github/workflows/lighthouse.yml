name: Lighthouse

# Weekly audit of pirson.dev; rebuilds every SVG in assets/ (also moves the "today" line of the timeline).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # shortcut: a single run, so Performance can move a few points week to week; take the median of 3 runs if it gets noisy
      - name: Run Lighthouse
        run: npx -y lighthouse@12 https://pirson.dev/ --preset=desktop --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh.json --quiet
      - name: Build SVGs
        run: node scripts/build.mjs lh.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Update Lighthouse scores and timeline"
            git push
          fi
