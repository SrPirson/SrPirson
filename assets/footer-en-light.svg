<svg xmlns="http://www.w3.org/2000/svg" width="840" height="112" viewBox="0 0 840 112" role="img" aria-label="console">
  <defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><clipPath id="r"><rect width="840" height="112" rx="10"/></clipPath></defs>
  <style>
    text { font-family: 'Segoe UI', Inter, 'DejaVu Sans', Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .mono { font-family: Consolas, 'JetBrains Mono', 'DejaVu Sans Mono', monospace; white-space: pre; }
    .dim { fill: #57606a; }
    .in { opacity: 0; animation: in .5s ease-out forwards; }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .in, .caret { animation: none; opacity: 1; } }
  </style>
  <g clip-path="url(#r)">
    <rect width="840" height="112" fill="#ffffff"/>
    <rect width="840" height="34" fill="#f6f8fa"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="37" cy="17" r="5" fill="#febc2e"/><circle cx="54" cy="17" r="5" fill="#28c840"/>
    <text x="420" y="22" text-anchor="middle" class="mono dim" style="font-size:12px">console</text>
    
    <text x="20" y="62" class="mono in" style="animation-delay:.2s"><tspan style="fill:#3b82f6">&gt;</tspan> console.<tspan style="fill:#8250df">log</tspan>(<tspan style="fill:#0a3069">"Thanks for stopping by. Let's build something great together."</tspan>)</text>
    <text x="20" y="90" class="mono in" style="animation-delay:.9s"><tspan style="fill:#3b82f6">&gt;</tspan> <tspan class="caret" style="fill:#22d3ee">▍</tspan></text>
  </g>
  <rect x=".5" y=".5" width="839" height="111" rx="10" fill="none" stroke="#d0d7de"/>
</svg>
