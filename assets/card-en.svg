<svg xmlns="http://www.w3.org/2000/svg" width="840" height="452" viewBox="0 0 840 452" role="img" aria-labelledby="t">
  <title id="t">Francisco (SrPirson) - Full Stack Web Developer from Málaga, Spain</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11142a"/>
      <stop offset="1" stop-color="#070812"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd100" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffd100" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Verdana, "DejaVu Sans", Arial, sans-serif; font-size: 16px; fill: #fff; }
    .title { font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: bold; fill: #ff8000; }
    .green { fill: #1eff00; }
    .flavor { fill: #ffd100; font-style: italic; }
    .dim { fill: #9d9d9d; }
    .l { opacity: 0; animation: in .45s ease-out forwards; }
    .glint { animation: run 7s linear infinite; }
    .icon { animation: pulse 3s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes run { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1000; } }
    @keyframes pulse { 50% { stroke: #fff3b0; } }
    @media (prefers-reduced-motion: reduce) { .l, .glint, .icon { animation: none; opacity: 1; } }
  </style>

  <!-- item icon -->
  <rect class="icon" x="16" y="18" width="72" height="72" rx="6" fill="url(#icon)" stroke="#ffd100" stroke-width="2"/>
  <text x="52" y="63" text-anchor="middle" style="font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: 26px; font-weight: bold;">&lt;/&gt;</text>

  <!-- tooltip -->
  <rect x="104" y="10" width="726" height="432" rx="8" fill="url(#bg)" stroke="#4a4f6a" stroke-width="2"/>
  <rect class="glint" x="104" y="10" width="726" height="432" rx="8" fill="none" stroke="url(#gold)" stroke-width="2.5" pathLength="1000" stroke-dasharray="90 910"/>

  <text class="l title" x="128" y="50" style="animation-delay:.1s">Francisco · SrPirson</text>
  <text class="l" x="128" y="82" style="animation-delay:.3s">Soulbound</text>
  <text class="l" x="128" y="106" style="animation-delay:.45s">Unique-Equipped</text>
  <text class="l" x="128" y="130" style="animation-delay:.6s">Full Stack</text>
  <text class="l" x="806" y="130" text-anchor="end" style="animation-delay:.6s">Web Developer</text>

  <text class="l" x="128" y="164" style="animation-delay:.8s">+15 Java · Spring Boot</text>
  <text class="l" x="128" y="188" style="animation-delay:.95s">+14 JavaScript · TypeScript · React</text>
  <text class="l" x="128" y="212" style="animation-delay:1.1s">+12 PHP · Laravel · SQL</text>
  <text class="l" x="128" y="236" style="animation-delay:1.25s">+10 Lua · Python</text>

  <text class="l green" x="128" y="270" style="animation-delay:1.5s">Equip: Ships 20+ open-source World of Warcraft addons.</text>
  <text class="l green" x="128" y="294" style="animation-delay:1.7s">Equip: Builds tools for Claude Code (cabina, webeyes).</text>
  <text class="l green" x="128" y="318" style="animation-delay:1.9s">Use: Turns an idea into a deployed app. (No cooldown)</text>

  <text class="l" x="128" y="352" style="animation-delay:2.1s">Durability 100 / 100</text>
  <text class="l dim" x="128" y="376" style="animation-delay:2.25s">Location: Málaga, Spain</text>
  <text class="l flavor" x="128" y="414" style="animation-delay:2.5s">"Trained as a web developer. Still leveling up."</text>
</svg>
