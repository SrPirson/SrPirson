<svg xmlns="http://www.w3.org/2000/svg" width="840" height="452" viewBox="0 0 840 452" role="img" aria-labelledby="t">
  <title id="t">Francisco (SrPirson) - Frontend Developer from Málaga, Spain</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="win"><rect x="10" y="10" width="820" height="432" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "DejaVu Sans", Arial, sans-serif; fill: #1f2328; }
    .code text, .mono { font-family: Consolas, "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 14px; white-space: pre; }
    .n { fill: #8c959f; text-anchor: end; }
    .k { fill: #cf222e; } .s { fill: #0a3069; } .c { fill: #116329; } .a { fill: #8250df; } .p { fill: #1f2328; } .f { fill: #8250df; }
    .type { clip-path: inset(0 100% 0 0); animation: type .45s steps(24, end) forwards; }
    .show { opacity: 0; animation: show .6s ease-out forwards; }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes show { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .type, .show, .caret { animation: none; clip-path: none; opacity: 1; } }
  </style>

