      <text class="n" x="40" y="110">1</text><text class="n" x="40" y="132">2</text><text class="n" x="40" y="154">3</text><text class="n" x="40" y="176">4</text><text class="n" x="40" y="198">5</text><text class="n" x="40" y="220">6</text><text class="n" x="40" y="242">7</text><text class="n" x="40" y="264">8</text><text class="n" x="40" y="286">9</text><text class="n" x="40" y="308">10</text><text class="n" x="40" y="330">11</text><text class="n" x="40" y="352">12</text>

      <text class="type" x="54" y="110" style="animation-delay:.2s"><tspan class="k">import</tspan> <tspan class="p">{ Developer }</tspan> <tspan class="k">from</tspan> <tspan class="s">"./me"</tspan><tspan class="p">;</tspan></text>
      <text class="type" x="54" y="154" style="animation-delay:.6s"><tspan class="k">export default function</tspan> <tspan class="f">Francisco</tspan><tspan class="p">() {</tspan></text>
      <text class="type" x="54" y="176" style="animation-delay:1s"><tspan class="p">  </tspan><tspan class="k">return</tspan><tspan class="p"> (</tspan></text>
      <text class="type" x="54" y="198" style="animation-delay:1.3s"><tspan class="p">    &lt;</tspan><tspan class="c">Developer</tspan></text>
      <text class="type" x="54" y="220" style="animation-delay:1.6s"><tspan class="a">      role</tspan><tspan class="p">=</tspan><tspan class="s">"Frontend Developer"</tspan></text>
      <text class="type" x="54" y="242" style="animation-delay:2s"><tspan class="a">      stack</tspan><tspan class="p">={[</tspan><tspan class="s">"React"</tspan><tspan class="p">, </tspan><tspan class="s">"TypeScript"</tspan><tspan class="p">, </tspan><tspan class="s">"Tailwind"</tspan><tspan class="p">]}</tspan></text>
      <text class="type" x="54" y="264" style="animation-delay:2.4s"><tspan class="a">      also</tspan><tspan class="p">={[</tspan><tspan class="s">"Java"</tspan><tspan class="p">, </tspan><tspan class="s">"Spring Boot"</tspan><tspan class="p">, </tspan><tspan class="s">"PHP"</tspan><tspan class="p">]}</tspan></text>
      <text class="type" x="54" y="286" style="animation-delay:2.8s"><tspan class="a">      based</tspan><tspan class="p">=</tspan><tspan class="s">"Málaga, ES"</tspan></text>
      <text class="type" x="54" y="308" style="animation-delay:3.1s"><tspan class="p">    /&gt;</tspan></text>
      <text class="type" x="54" y="330" style="animation-delay:3.3s"><tspan class="p">  );</tspan></text>
      <text class="type" x="54" y="352" style="animation-delay:3.5s"><tspan class="p">}</tspan><tspan class="caret" style="fill:#22d3ee">▍</tspan></text>
    </g>

    <!-- status bar -->
    <rect x="10" y="414" width="470" height="28" fill="#f6f8fa"/>
    <text class="show mono" x="24" y="433" style="font-size:12px; fill:#116329; animation-delay:3.9s">✓ Compiled successfully in 312 ms</text>

