      <circle cx="655" cy="152" r="34" fill="url(#accent)"/>
      <text x="655" y="163" text-anchor="middle" style="font-size:30px; font-weight:700; fill:#fff">F</text>
      <text x="655" y="218" text-anchor="middle" style="font-size:22px; font-weight:700; fill:#1f2328">Francisco</text>
      <text x="655" y="243" text-anchor="middle" style="font-size:15px; fill:#6366f1; font-weight:600">Frontend Developer</text>
      <text x="655" y="265" text-anchor="middle" style="font-size:13px; fill:#656d76">Málaga, Spain</text>
      <rect x="530" y="284" width="62" height="24" rx="12" fill="#e0f2fe"/><text x="561" y="301" text-anchor="middle" style="font-size:12px; fill:#0369a1">React</text>
      <rect x="600" y="284" width="96" height="24" rx="12" fill="#e0e7ff"/><text x="648" y="301" text-anchor="middle" style="font-size:12px; fill:#4338ca">TypeScript</text>
      <rect x="704" y="284" width="76" height="24" rx="12" fill="#ccfbf1"/><text x="742" y="301" text-anchor="middle" style="font-size:12px; fill:#0f766e">Tailwind</text>
      <rect x="575" y="334" width="160" height="38" rx="19" fill="url(#accent)"/>
      <text x="655" y="358" text-anchor="middle" style="font-size:14px; font-weight:600; fill:#fff">Let's talk →</text>
